<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to the index.html with the original path
      const pathSegments = window.location.pathname
        .split('/')
        .filter(p => p);
      
      if (pathSegments.length > 0 && !pathSegments[0].includes('.')) {
        // Redirect to index.html with the path as a hash route
        // This allows client-side routing to handle the navigation
        window.location.replace(
          window.location.origin + 
          (window.location.pathname.includes('elevyn-north-labs') ? '/elevyn-north-labs' : '') + 
          '/#' + 
          window.location.pathname
        );
      } else {
        // If it's a file request that failed, redirect to home
        window.location.replace(
          window.location.origin +
          (window.location.pathname.includes('elevyn-north-labs') ? '/elevyn-north-labs' : '') +
          '/'
        );
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
